{% extends "base.html" %}

{% block title %}新規登録 | 三日坊主を極める{% endblock %}

{% block page_css %}
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/signup_style.css') }}"
  >
{% endblock %}

{% block content %}
    <main class="auth-container">
        <section class="auth-card">

            <h1>新規登録</h1>

            {% if error %}
             <p>{{ error }}</p>
            {% endif %}
            

<form method="POST">
    <div class="form-group">
        <label for="login_id">ID</label>

        <input
        type="text"
        id="login_id"
        name="login_id"
        placeholder="半角英数で入力"
        >

    </div>

    
    <div class="form-group">
        <label for="user_name">名前</label>

        <input
            type="text"
            id="user_name"
            name="user_name"
            placeholder="名前@◯期生"
        >
    </div>

    <div class="form-group">
        <label for="password">パスワード</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="パスワードを入力"
        >
    </div>

    <button type="submit" class="main-button">
        登録する
    </button>


</form>

<p class="page-link">
    <a href="{{ url_for('login.login') }}">
        ログインはこちら
    </a>
</p>

        </section>
    </main>
{% endblock %}
