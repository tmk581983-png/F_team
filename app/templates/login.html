{% extends "base.html" %}

{% block title %}ログイン | 三日坊主を極める{% endblock %}

{% block page_css %}
 <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/login_style.css') }}"
    >
{% endblock %}
{% block content %}


  <main class="auth-container">
    <section class="auth-card">
      <h1>3日坊主を<span>極める</span></h1>
      {% if error %}
      <div class="error-popup" id="errorPopup">
        <div class="error-popup-content">
          <p>{{ error }}</p>
          <button type="button" onclick="closeErrorPopup()">OK</button>
        </div>
      </div>

      <script>
        function closeErrorPopup(){
           document.getElementById("errorPopup").style.display = "none";
        }
      </script>
      {% endif %} 

      <form method="POST">

        <div class="form-group">
          <label for="user_id">ID</label>

          <input
            type="text"
            id="user_id"
            name="user_id"
            placeholder="IDを入力"
          >
        </div>

        <div class="form-group">
          <label for="password">パスワード</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="パスワードを入力"
          >
        </div>

        <button type="submit" class="main-button">
          ログイン
        </button>

      </form>

      <p class="page-link">
        <a href="{{ url_for('signup.index') }}">
          新規登録はこちら
        </a>
      </p>

    </section>
  </main>


{% endblock %}
